# Steps dist injects into its release build jobs (`github-build-setup` in
# dist-workspace.toml). Everything here has to be non-interactive and work on
# the bare runner, before `dist build` runs.
- name: Install cmake
  if: ${{ runner.os == 'Linux' }}
  run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake libudev-dev zstd

# Building `hodor-ebpf` compiles `hodor-ebpf-programs` for the `bpf` target, which
# needs a nightly compiler with `-Z build-std` and the `bpf-linker` linker
# (a stable rustc cannot build the no_std BPF target, and a missing `bpf-linker`
# fails the link step with `linker not found`).
- name: Install the eBPF build toolchain
  if: ${{ runner.os == 'Linux' }}
  run: |
    set -euo pipefail
    rustup toolchain install nightly --profile minimal
    # bpf-linker runs on the build host, so its prebuilt has to match the
    # runner's architecture, not the `--target` being built: dist builds the
    # aarch64 target on an aarch64 runner.
    case "$(uname -m)" in
    x86_64) linker_arch=x86_64 ;;
    aarch64 | arm64) linker_arch=aarch64 ;;
    *) echo "no prebuilt bpf-linker for $(uname -m)" >&2; exit 1 ;;
    esac
    # Prebuilt rather than `cargo install`: building bpf-linker from source
    # needs a matching LLVM development tree, which is not worth the fragility
    # on a release runner.
    url="https://github.com/aya-rs/bpf-linker/releases/download/v0.11.1/bpf-linker-${linker_arch}-unknown-linux-musl.tar.zst"
    curl --proto '=https' --tlsv1.2 -sSfL "$url" -o /tmp/bpf-linker.tar.zst
    tar --zstd -xf /tmp/bpf-linker.tar.zst -C /tmp
    sudo install -m 0755 /tmp/bpf-linker /usr/local/bin/bpf-linker
    bpf-linker --version
