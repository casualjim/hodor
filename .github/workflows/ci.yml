name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --features tun -- -D warnings

      - name: Test
        run: cargo nextest run

      - name: Test (tun)
        run: cargo nextest run --features tun

  image:
    # Publishes ghcr.io/<repo>:main so the example can pull an image instead of
    # building one. Releases publish :<version> and :latest from container.yml,
    # for both architectures. This one is amd64 only.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: rust
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake

      - name: Build the release binary
        run: cargo build --release --features tun

      - name: Stage the image context
        run: |
          mkdir ctx
          cp target/release/hodor ctx/hodor

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ctx
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:main
