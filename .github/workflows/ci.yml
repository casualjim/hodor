name: CI

on:
  pull_request:
  push:
    branches: [main, master]

# mise reads `mise.<env>.toml` alongside `mise.toml`, so this is what selects
# mise.ci.toml. Workflow-level so mise-action's `mise install --locked` and
# every `run:` step see the same environment.
env:
  MISE_ENV: ci

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libudev-dev zstd

      - uses: jdx/mise-action@v4
        with:
          experimental: true
          install: true
          cache: true

      - name: Install clang matching rustc's LLVM major
        run: |-
          set -euxo pipefail
          llvm_major="$(rustc -Vv | awk -F': ' '/^LLVM version:/ {sub(/\..*/, "", $2); print $2}')"
          curl -sSL https://apt.llvm.org/llvm.sh | sudo bash -s -- "$llvm_major"
          sudo apt-get install -y --no-install-recommends "clang-${llvm_major}"
          sudo update-alternatives --install /usr/bin/clang clang "/usr/bin/clang-${llvm_major}" 100
          test "$(clang -dumpversion | cut -d. -f1)" = "$llvm_major"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Lint
        run: |-
          hk validate
          hk check --all

      - name: Buld & Test
        run: mise build


