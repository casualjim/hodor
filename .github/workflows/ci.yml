name: CI

on:
  pull_request:
  push:
    branches: [main, master]

# mise reads `mise.<env>.toml` alongside `mise.toml`, so this is what selects
# mise.ci.toml. Workflow-level so mise-action's `mise install --locked` and
# every `run:` step see the same environment.
env:
  MISE_ENV: ci

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libudev-dev zstd

      - uses: jdx/mise-action@v4
        with:
          experimental: true
          install: true
          cache: true

      - name: install nightly rust toolchain
        run: rustup toolchain install nightly-${{matrix.target}}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Lint
        run: |-
          hk validate
          hk check --all

      - name: Buld & Test
        run: mise build

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          build-args: BIN_DIR=target/release
          platforms: linux/amd64
          pull: true
          push: true
          tags: ghcr.io/${{ github.repository }}:main
