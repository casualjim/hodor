# Container image: packs the binaries the Release workflow just published.
# Called by the dist-generated release.yml via `post-announce-jobs`.
# No compile, no rebuild — downloads the dist tarballs from the GitHub release.
name: Container

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            target: x86_64-unknown-linux-gnu
            digest-suffix: amd64
          - platform: linux/arm64
            target: aarch64-unknown-linux-gnu
            digest-suffix: arm64
    steps:
      - name: Resolve tag
        run: echo "TAG=${{ fromJson(inputs.plan).announcement_tag }}" >> "$GITHUB_ENV"

      - name: Download release binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir ctx
          asset="hodor-${{ matrix.target }}.tar.xz"
          gh release download "$TAG" -p "$asset" -O bundle.tar.xz
          tar xJf bundle.tar.xz -C ctx
          test -x ctx/hodor

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ctx
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,push=true

      - name: Export digest
        run: |
          mkdir -p digests
          digest="${{ steps.build.outputs.digest }}"
          touch "digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.digest-suffix }}
          path: digests/*
          if-no-files-found: error

  merge:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        run: echo "TAG=${{ fromJson(inputs.plan).announcement_tag }}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: digests
        run: |
          ver="${TAG#v}"
          srcs="$(printf "${{ env.IMAGE }}@sha256:%s " *)"
          args=(-t "$IMAGE:$ver")
          case "$ver" in
            *-*) ;; # prerelease: no latest
            *) args+=(-t "$IMAGE:latest") ;;
          esac
          # shellcheck disable=SC2086 # word-split is the point: one arg per digest
          docker buildx imagetools create "${args[@]}" $srcs

      - name: Inspect image
        run: docker buildx imagetools inspect "${IMAGE}:${TAG#v}"