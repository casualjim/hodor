[package]
name = "hodor"
version = "0.1.16"
edition = "2024"
description = "grant-scoped MITM proxy"
license = "Apache-2.0"
repository = "https://github.com/casualjim/hodor"
readme = "README.md"
keywords = ["mitm", "proxy", "tls"]
categories = ["network-programming"]

[package.metadata.dist]
# hodor is a single static-friendly binary; container + tarballs ship from CI.

[package.metadata.release]
sign-commit = false
sign-tag = false
publish = false
allow-branch = ["main"]
pre-release-commit-message = "chore: Release {{crate_name}} version {{version}}"

[features]
tun = ["smoltcp", "dep:tun"]

[dependencies]
base62 = "2.0"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
code-workspace = "0.1.4"
confique = { version = "0.4", features = ["toml"] }
dashmap = "6"
dirs = "6"
eyre = "0.6"
fnox-core = "1.33"
futures-sink = "0.3"
futures-util = "0.3.34"
hex = "0.4"
httlib-hpack = "0.1.3"
httparse = "1"
keepass = "=0.13.22" # pinned: 0.13.23+ ships an upper-bound-only aes range that resolves to aes 0.8.4 and breaks the cbc/cipher traits; see README
libc = "0.2"
miette = { version = "7", features = ["fancy"] }
mimalloc = "0.1"
netlink-packet-core = "0.9"
netlink-packet-netfilter = "0.4"
netlink-sys = "0.8"
rama = { git = "https://github.com/plabayo/rama", default-features = false, features = ["tcp"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
rtnetlink = "0.23.0"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "logging", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pki-types = "1"
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_norway = "0.9"
sha2 = "0.10"
smoltcp = { version = "0.14", default-features = false, features = ["alloc", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-dns", "socket-icmp", "socket-tcp", "socket-udp", "std"], optional = true }
socket2 = "0.6"
time = "=0.3.47" # pinned: rama main requires exactly 0.3.47; bump together with Cargo.lock's rama rev
tokio = { version = "1", features = ["io-util", "macros", "net", "parking_lot", "rt-multi-thread", "sync", "time"] }
tokio-rustls = "0.26"
tokio-util = "0.7"
toml = "0.8"
toml_edit = { version = "0.25", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tun = { version = "0.7", features = ["async"], optional = true }
url = "2"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"

[lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[lints.clippy]
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
cargo = { level = "warn", priority = -1 }
cast_precision_loss = "allow"
clone_on_ref_ptr = "warn"
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
float_cmp = "allow"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
implicit_clone = "warn"
literal_string_with_formatting_args = "allow"
map_err_ignore = "warn"
multiple_crate_versions = "allow"
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
