[package]
name = "hodor-compose"
version = "0.1.16"
edition = "2024"
description = "grant-scoped MITM proxy: workspace confinement and compose generation"
license = "Apache-2.0"
repository = "https://github.com/casualjim/hodor"
publish = false

[dependencies]
base64 = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
gix-config = { version = "0.61", features = ["sha1"] }
gix-discover = { version = "0.56", features = ["sha1"] }
hodor-config = { workspace = true }
hodor-fnox = { workspace = true }
hodor-pki = { workspace = true }
libc = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_yaml = "0.9"
shellexpand = "3"
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
xpanda = "0.2"

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
