[package]
name = "hodor-compose"
version = "0.1.16"
edition = "2024"
description = "grant-scoped MITM proxy: workspace confinement and compose generation"
license = "Apache-2.0"
repository = "https://github.com/casualjim/hodor"
publish = false

[dependencies]
dirs = "6"
hodor-config = { path = "../hodor-config" }
hodor-fnox = { path = "../hodor-fnox" }
hodor-pki = { path = "../hodor-pki" }
libc = "0.2"
secrecy = "0.10"
shellexpand = "3"
thiserror = "2"
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread", "time"] }
toml_edit = { version = "0.25", features = ["serde"] }
tracing = "0.1"
xpanda = "0.2"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"

[lints]
workspace = true
