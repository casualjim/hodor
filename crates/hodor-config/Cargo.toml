[package]
name = "hodor-config"
version = "0.1.16"
edition = "2024"
description = "grant-scoped MITM proxy: config overlay, rules, grants, and the CLI"
license = "Apache-2.0"
repository = "https://github.com/casualjim/hodor"
publish = false

[dependencies]
base62 = "2.0"
clap = { workspace = true }
code-workspace = "0.1.4"
confique = { workspace = true }
dirs = { workspace = true }
hex = "0.4"
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
validator = { version = "0.20", features = ["derive"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
