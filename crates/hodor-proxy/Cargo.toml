[package]
name = "hodor-proxy"
version = "0.1.16"
edition = "2024"
description = "grant-scoped MITM proxy: substitution machines and the relay core"
license = "Apache-2.0"
repository = "https://github.com/casualjim/hodor"
publish = false

[dependencies]
base64 = { workspace = true }
bytes = "1"
hodor-config = { workspace = true }
hodor-pki = { workspace = true }
hodor-plugin = { workspace = true }
httlib-hpack = "0.1.3"
httparse = "1"
pgwire = { version = "0.41", default-features = false }
rama = { workspace = true, features = ["boring", "tcp"] }
russh = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = "0.8"
secrecy = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
async-trait = "0.1"
futures = "0.3"
h2 = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# server-api-aws-lc-rs also turns on pgwire's TLS acceptor, which the
# handshake tests drive with a real rustls server.
pgwire = { version = "0.41", default-features = false, features = ["server-api-aws-lc-rs"] }
pretty_assertions = { workspace = true }
proptest = "1"
tempfile = { workspace = true }
tokio-postgres = "0.7"

[lints]
workspace = true
