[package]
name = "hodor-proxy"
version = "0.1.16"
edition = "2024"
description = "grant-scoped MITM proxy: substitution machines and the relay core"
license = "Apache-2.0"
repository = "https://github.com/casualjim/hodor"
publish = false

[dependencies]
base64 = { workspace = true }
bytes = { workspace = true }
hodor-config = { workspace = true }
hodor-pki = { workspace = true }
hodor-plugin = { workspace = true }
httlib-hpack = { workspace = true }
httparse = { workspace = true }
pgwire = { workspace = true }
rama = { workspace = true, features = ["boring", "tcp"] }
russh = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
secrecy = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
futures = { workspace = true }
h2 = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
# server-api-aws-lc-rs also turns on pgwire's TLS acceptor, which the
# handshake tests drive with a real rustls server.
pgwire = { workspace = true, features = ["server-api-aws-lc-rs"] }
pretty_assertions = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
tokio-postgres = { workspace = true }

[lints]
workspace = true
