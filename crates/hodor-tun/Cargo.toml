[package]
name = "hodor-tun"
version = "0.1.16"
edition = "2024"
description = "grant-scoped MITM proxy: userspace TUN capture backend"
license = "Apache-2.0"
repository = "https://github.com/casualjim/hodor"
publish = false

[dependencies]
futures-sink = "0.3"
futures-util = { workspace = true }
hodor-config = { workspace = true }
hodor-pki = { workspace = true }
hodor-proxy = { workspace = true }
rtnetlink = { workspace = true }
rustls = { workspace = true }
secrecy = { workspace = true }
smoltcp = { version = "0.14", default-features = false, features = ["alloc", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-dns", "socket-icmp", "socket-tcp", "socket-udp", "std"] }
socket2 = "0.6"
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tokio-util = "0.7"
tracing = { workspace = true }
tun = { version = "0.7", features = ["async"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
