[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# aws-lc-sys needs cmake to build its C sources.
github-build-setup = "../build-setup.yml"
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
# Binaries built here are what the container image packs: no second compile.
targets = ["aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Extra cargo args for every dist build: the tun feature ships in the binary.
cargo = ["--features", "tun"]
# Container image build, inlined into the release pipeline (no separate trigger):
# downloads the dist tarballs from the GitHub release this run just published.
post-announce-jobs = ["./container"]