[providers.argo-cd]
env = ["ARGOCD_AUTH_TOKEN", "ARGOCD_TOKEN"]
pattern = "eyJ{base62:32}.{base62:32}.{base62:32}"
# source: https://raw.githubusercontent.com/argoproj/argo-cd/master/docs/user-guide/environment-variables.md
# source: https://raw.githubusercontent.com/argoproj/argo-cd/master/docs/developer-guide/api-docs.md
# note: `ARGOCD_AUTH_TOKEN` is the env var the CLI page documents ("the Argo CD `apiKey` for your Argo CD user"); the API-docs curl example passes the bearer token from `$ARGOCD_TOKEN`.
# note: the API server is self-hosted (`ARGOCD_SERVER`, e.g. `argocd.example.com`); rules carry explicit allow entries.
# note: tokens are JWTs — the API-docs session example header is `eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9` — so the pattern approximates a three-segment JWT and its segment lengths.

[providers.argo-workflows]
env = ["ARGO_TOKEN"]
pattern = "eyJ{base62:32}.{base62:32}.{base62:32}"
# source: https://raw.githubusercontent.com/argoproj/argo-workflows/main/docs/access-token.md
# note: the access-token page sets `ARGO_TOKEN` from a Kubernetes service-account token and uses it as `Authorization: $ARGO_TOKEN`; the documented value includes a literal `Bearer ` prefix, which the pattern omits so the decoy stays a bare token.
# note: the Argo Server is self-hosted (`ARGO_SERVER`, e.g. `https://localhost:2746`); rules carry explicit allow entries.
# note: tokens are Kubernetes service-account JWTs; the pattern approximates one.

[providers.asana]
env = ["ASANA_ACCESS_TOKEN", "ASANA_PAT"]
hosts = ["https://app.asana.com"]
pattern = "{base62:32}"
# source: https://developers.asana.com/reference/getattachmentsforobject.md
# source: https://raw.githubusercontent.com/Asana/php-asana/master/examples/example-accesstoken.php
# source: https://developers.asana.com/docs/personal-access-token
# source: https://developers.asana.com/docs/quick-start
# note: `ASANA_PAT` is the name Asana's API reference uses in its curl example (`Authorization: Bearer $ASANA_PAT`); `ASANA_ACCESS_TOKEN` is what the official PHP client example reads via `getenv`.
# note: the PAT page declares Asana tokens opaque and warns the format may change without notice, so the pattern approximates rather than states a shape.

[providers.atlassian-cloud]
env = ["JIRA_API_TOKEN"]
hosts = ["https://*.atlassian.net", "https://api.atlassian.com"]
pattern = "{base62:24}"
# source: https://support.atlassian.com/atlassian-account/docs/manage-api-tokens-for-your-atlassian-account/
# source: https://developer.atlassian.com/cloud/jira/platform/basic-auth-for-rest-apis/
# source: https://developer.atlassian.com/cloud/jira/platform/rest/v3/intro/
# source: https://raw.githubusercontent.com/atlassian/gajira-login/master/README.md
# note: covers Jira on Atlassian Cloud; every site is `<site>.atlassian.net`, and scoped API tokens call Jira at `https://api.atlassian.com/ex/jira/<cloudId>`.
# note: the token pairs with the account email in basic auth; only the token variable is listed here, not the email.
# note: Atlassian states API tokens use a varied (non-fixed) length, so `{base62:24}` approximates the 24-character `JIRA_API_TOKEN` example Atlassian's own gajira-login action documents.

