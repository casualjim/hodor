# note: the docs use `$DEEPINFRA_TOKEN` for the native API and `$DEEPINFRA_API_KEY` for the scoped-jwt endpoints; no key length is stated, and scoped JWTs carry a `jwt:` prefix.

[providers.deepseek]
env = ["DEEPSEEK_API_KEY"]
hosts = ["https://api.deepseek.com"]
pattern = "{base62:32}"
# source: https://api-docs.deepseek.com/
# note: the docs show the variable and base URL in an OpenAI-compatible example; the key format is not stated.

[providers.digitalocean]
env = ["DIGITALOCEAN_TOKEN"]
hosts = ["https://api.digitalocean.com"]
pattern = "{hex:64}"
# source: https://docs.digitalocean.com/reference/api/create-personal-access-token/
# source: https://docs.digitalocean.com/reference/libraries/
# source: https://docs.digitalocean.com/reference/api/reference/droplets/
# note: the token length is not stated in the docs; `{hex:64}` matches DigitalOcean's token shape.

[providers.dinference]
env = ["DINFERENCE_API_KEY"]
hosts = ["https://api.dinference.com"]
pattern = "{base62:32}"
# source: https://models.dev/api.json (curated provider catalog)
# note: no vendor page states a key format; the shape is generic.

[providers.dnsimple]
env = ["DNSIMPLE_TOKEN"]
hosts = ["https://api.dnsimple.com", "https://api.sandbox.dnsimple.com"]
pattern = "{base62:64}"
# source: https://developer.dnsimple.com/cli/
# source: https://developer.dnsimple.com/v2/
# source: https://support.dnsimple.com/articles/api-access-token/
# note: the CLI page shows `DNSIMPLE_TOKEN`, and the API v2 page documents `Authorization: Bearer <token>`; no page states the token's shape, so the pattern approximates it.

[providers.docker-hub]
env = ["DOCKERHUB_TOKEN"]
hosts = ["https://auth.docker.io", "https://hub.docker.com"]
pattern = "{base62:32}"
# source: https://docs.docker.com/security/access-tokens/
# source: https://docs.docker.com/reference/api/registry/auth/
# source: https://github.com/docker/login-action
# note: no docs.docker.com page names `DOCKERHUB_TOKEN`; the Docker-published login action uses it as the PAT supplied in place of a password.
# note: the docs state no PAT format, so the shape is generic; `hub.docker.com` is the token-exchange host and `auth.docker.io` the registry token server.

[providers.doppler]
env = ["DOPPLER_TOKEN"]
hosts = ["https://api.doppler.com"]
pattern = "dp.st.{base62:3}.{base62:24}"
# source: https://docs.doppler.com/docs/service-tokens
# source: https://docs.doppler.com/docs/cli
# note: docs show `dp.st.prd.xxxx` / `dp.st.dev.fHhinxK...`; the middle segment is the config slug (e.g. `prd`, `dev`) and segment lengths are not stated, so the pattern approximates.

[providers.drone]
env = ["DRONE_TOKEN"]
pattern = "eyJ{base62:32}.{base62:32}.{base62:32}"
# source: https://0-8-0.docs.drone.io/cli-authentication/
# note: the page documents `export DRONE_TOKEN=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...` alongside `DRONE_SERVER`; the token is a personal access token from the user profile screen, so the pattern approximates a JWT.
# note: the cited page is Drone's versioned 0.8 CLI-authentication documentation; the current site no longer serves that path (`docs.drone.io/cli/authentication/` returns 404).
# note: Drone control planes are self-hosted (`DRONE_SERVER`, e.g. `http://drone.mycompany.com`); rules carry explicit allow entries.

