# source: https://www.anaconda.com/docs/anaconda-platform/cloud/admin/anaconda-auth-reference
# note: Anaconda documents `ANACONDA_AUTH_API_KEY`, not `ANACONDA_API_TOKEN`; the key is passed as a Docker secret and an `Authorization: Bearer` header.
# note: the cited pages state no key format; `repo.anaconda.cloud` is the channel host they name, and platform deployments authenticate against a per-site `domain` (`anaconda.com` by default).

