# note: the official Qianfan SDK reads `QIANFAN_AK`/`QIANFAN_SK` (LLM API key pair), `QIANFAN_ACCESS_KEY`/`QIANFAN_SECRET_KEY` (console IAM pair), and `QIANFAN_BEARER_TOKEN`; only the bearer key suits a single-pattern entry.
# note: `https://aip.baidubce.com` is the SDK default LLM base URL and `https://qianfan.baidubce.com` the console/v2 API host.
# note: no fetched source states the key shape; the pattern is generic.

