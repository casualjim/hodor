# Bundled registry: environment names, API hosts, and token shapes.
# Override any entry from <config-dir>/hodor/rules.d/*.toml or
# <project-root>/.config/hodor/rules.d/*.toml; see README.
#
# `hosts` are stable API endpoints; a service whose endpoint is per tenant
# uses the host family its docs state (`https://*.example.com`).
# `pattern` keeps the prefix a platform documents; where the docs state no
# format, the shape approximates that platform's tokens.

[providers.302ai]
env = ["302AI_API_KEY"]
hosts = ["https://api.302.ai"]
pattern = "{base62:32}"
# source: https://models.dev/api.json (curated provider catalog)
# note: no vendor page states a key format; the shape is generic.

