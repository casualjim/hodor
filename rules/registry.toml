hosts = ["https://*.maas.aliyuncs.com"]
pattern = "sk-{base62:32}"
# source: https://www.alibabacloud.com/help/en/model-studio/first-api-call-to-qwen
# note: Model Studio (Qwen/DashScope) documents `export DASHSCOPE_API_KEY`; every example base URL is a workspace-prefixed per-region host (`{WorkspaceId}.ap-southeast-1`, `.cn-beijing`, `.us-east-1.maas.aliyuncs.com`), so the wildcard covers the host family.
# note: the key examples render as `sk-xxx`/`sk-ee166797fe40xxx`; the body length is not stated, so the pattern approximates it.
# note: Singapore, US (Virginia), and China (Beijing) API keys are not interchangeable.

