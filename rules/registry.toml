# note: `AKEYLESS_API_KEY` is documented as the Kubernetes Secrets Injector's Helm-chart env (with `AKEYLESS_ACCESS_ID`/`AKEYLESS_ACCESS_TYPE`); no shell-level token env is documented.
# note: `https://vault.akeyless.io` is the documented US SaaS endpoint example; `AKEYLESS_URL`/`AKEYLESS_GATEWAY_URL` point to a per-deployment Gateway, so self-hosted gateways need explicit allow entries.
# note: the Access Key format and length are not stated in the docs; the pattern is the default shape.

