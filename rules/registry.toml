[providers.azure-devops]
env = ["AZURE_DEVOPS_EXT_PAT"]
hosts = ["https://dev.azure.com"]
pattern = "{base62:84}"
# source: https://learn.microsoft.com/en-us/azure/devops/cli/log-in-via-pat?view=azure-devops
# source: https://learn.microsoft.com/en-us/azure/devops/organizations/accounts/use-personal-access-tokens-to-authenticate?view=azure-devops
# note: the PAT-format section states tokens are 84 characters long with 52 randomised and an `AZDO` signature at positions 76-80; `{base62:84}` keeps the length only.

[providers.azure]
env = ["AZURE_CLIENT_SECRET"]
hosts = ["https://login.microsoftonline.com", "https://management.azure.com"]
pattern = "{base62:32}"
# source: https://learn.microsoft.com/en-us/dotnet/api/azure.identity.environmentcredential
# source: https://learn.microsoft.com/en-us/entra/identity-platform/v2-oauth2-client-creds-grant-flow
# source: https://learn.microsoft.com/en-us/rest/api/azure/

