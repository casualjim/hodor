[providers.gitea]
env = ["GITEA_TOKEN"]
hosts = ["https://gitea.com"]
pattern = "{hex:40}"
# source: https://docs.gitea.com/usage/actions/token-permissions/
# source: https://docs.gitea.com/development/api-usage/
# note: `GITEA_TOKEN` is documented as the Actions job token (`${{ secrets.GITEA_TOKEN }}`); the API-usage page shows tokens as 40-char lowercase hex (`sha1`).
# note: Gitea instances are typically self-hosted; `gitea.com` is the vendor SaaS host — add explicit allow entries for your instances in rules.d.

[providers.github]
env = ["GITHUB_TOKEN", "GH_TOKEN", "GITHUB_PAT"]
hosts = ["https://api.github.com", "https://github.com", "https://uploads.github.com"]
pattern = "ghp_{hex:40}"
contains = ["gh_"]
# source: https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/about-authentication-to-github

